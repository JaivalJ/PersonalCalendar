<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e8eaf6 0%, #fce4ec 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 24px;
    }

    .calendar {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 520px;
      overflow: hidden;
    }

    /* ── Header ── */
    .cal-header {
      background: linear-gradient(135deg, #5c6bc0 0%, #7e57c2 100%);
      color: #fff;
      padding: 28px 24px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .cal-header h2 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      flex: 1;
      text-align: center;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.18);
      border: none;
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.32);
    }

    .nav-btn:active {
      transform: scale(0.92);
    }

    /* ── Today shortcut ── */
    .today-btn {
      display: block;
      width: 100%;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
    }

    .today-label {
      display: block;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
      margin-top: 4px;
      transition: color 0.2s;
    }

    .today-label:hover { color: #fff; }

    /* ── Grid body ── */
    .cal-body {
      padding: 20px 20px 24px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 8px;
    }

    .weekday {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9e9e9e;
      padding: 6px 0;
    }

    .weekday.weekend-label {
      color: #ce93d8;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      color: #37474f;
      cursor: default;
      transition: background 0.15s, color 0.15s;
      position: relative;
    }

    .day-cell.weekend {
      background: #f3e5f5;
      color: #7b1fa2;
    }

    .day-cell.other-month {
      color: #c5c5c5;
      background: transparent;
    }

    .day-cell.other-month.weekend {
      background: transparent;
      color: #ddbcea;
    }

    .day-cell:not(.other-month):hover {
      background: #ede7f6;
      color: #5c6bc0;
    }

    .day-cell.weekend:not(.other-month):hover {
      background: #e1bee7;
      color: #6a1b9a;
    }

    .day-cell.today {
      background: linear-gradient(135deg, #5c6bc0, #7e57c2);
      color: #fff !important;
      font-weight: 700;
      box-shadow: 0 3px 12px rgba(92, 107, 192, 0.45);
    }

    .day-cell.today:hover {
      background: linear-gradient(135deg, #3f51b5, #6a3db5);
    }

    /* ── Footer ── */
    .cal-footer {
      border-top: 1px solid #f0f0f0;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      color: #9e9e9e;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .legend-dot.today-dot {
      background: linear-gradient(135deg, #5c6bc0, #7e57c2);
    }

    .legend-dot.weekend-dot {
      background: #f3e5f5;
      border: 1px solid #ce93d8;
    }

    /* ── Responsive ── */
    @media (max-width: 400px) {
      .cal-header h2 { font-size: 1.1rem; }
      .day-cell { font-size: 0.78rem; border-radius: 8px; }
      .cal-body { padding: 14px 12px 18px; }
      .days-grid { gap: 3px; }
    }
  </style>
</head>
<body>

<div class="calendar" role="application" aria-label="Monthly calendar">
  <div class="cal-header">
    <button class="nav-btn" id="prevBtn" aria-label="Previous month">&#8249;</button>
    <div style="flex:1;text-align:center;">
      <h2 id="monthYear"></h2>
      <button class="today-btn" id="todayBtn" aria-label="Go to today">
        <span class="today-label">Today</span>
      </button>
    </div>
    <button class="nav-btn" id="nextBtn" aria-label="Next month">&#8250;</button>
  </div>

  <div class="cal-body">
    <div class="weekdays">
      <div class="weekday weekend-label">Su</div>
      <div class="weekday">Mo</div>
      <div class="weekday">Tu</div>
      <div class="weekday">We</div>
      <div class="weekday">Th</div>
      <div class="weekday">Fr</div>
      <div class="weekday weekend-label">Sa</div>
    </div>
    <div class="days-grid" id="daysGrid" role="grid" aria-label="Calendar days"></div>
  </div>

  <div class="cal-footer">
    <div class="legend">
      <span class="legend-dot today-dot"></span>
      Today
    </div>
    <div class="legend">
      <span class="legend-dot weekend-dot"></span>
      Weekend
    </div>
  </div>
</div>

<script>
  const MONTHS = [
    'January','February','March','April','May','June',
    'July','August','September','October','November','December'
  ];

  const now = new Date();
  let viewYear  = now.getFullYear();
  let viewMonth = now.getMonth(); // 0-indexed

  function renderCalendar() {
    const grid      = document.getElementById('daysGrid');
    const monthYear = document.getElementById('monthYear');

    monthYear.textContent = `${MONTHS[viewMonth]} ${viewYear}`;

    const firstDay  = new Date(viewYear, viewMonth, 1).getDay(); // 0=Sun
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrev  = new Date(viewYear, viewMonth, 0).getDate();

    const todayY = now.getFullYear();
    const todayM = now.getMonth();
    const todayD = now.getDate();

    grid.innerHTML = '';

    // Leading days from previous month
    for (let i = firstDay - 1; i >= 0; i--) {
      const d = daysInPrev - i;
      const col = (firstDay - 1 - i); // 0-indexed column
      grid.appendChild(makeCell(d, true, col === 0 || col === 6));
    }

    // Current month days
    for (let d = 1; d <= daysInMonth; d++) {
      const col = (firstDay + d - 1) % 7;
      const isToday = (viewYear === todayY && viewMonth === todayM && d === todayD);
      const isWeekend = (col === 0 || col === 6);
      grid.appendChild(makeCell(d, false, isWeekend, isToday));
    }

    // Trailing days to complete grid (always fill to 6 rows = 42 cells)
    const totalCells = 42;
    const filled = firstDay + daysInMonth;
    const trailing = totalCells - filled;
    for (let d = 1; d <= trailing; d++) {
      const col = (filled + d - 1) % 7;
      grid.appendChild(makeCell(d, true, col === 0 || col === 6));
    }
  }

  function makeCell(day, otherMonth, isWeekend, isToday = false) {
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    cell.setAttribute('role', 'gridcell');
    cell.textContent = day;

    if (otherMonth) cell.classList.add('other-month');
    if (isWeekend && !isToday) cell.classList.add('weekend');
    if (isToday) {
      cell.classList.add('today');
      cell.setAttribute('aria-current', 'date');
      cell.setAttribute('aria-label', `Today, ${day}`);
    }
    return cell;
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderCalendar();
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderCalendar();
  });

  document.getElementById('todayBtn').addEventListener('click', () => {
    viewYear  = now.getFullYear();
    viewMonth = now.getMonth();
    renderCalendar();
  });

  renderCalendar();
</script>
</body>
</html>
