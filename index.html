<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Calendar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section class="calendar">
    <header>
      <button id="prev" aria-label="Previous month">&#8249;</button>
      <h1 id="title"></h1>
      <button id="next" aria-label="Next month">&#8250;</button>
      <button id="today" class="today-btn">Today</button>
    </header>
    <div class="weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div id="grid" class="grid"></div>
  </section>
  <aside class="events">
    <h2 id="selected-label"></h2>
    <form id="event-form">
      <input id="event-input" placeholder="Add an event…" required>
      <button type="submit">Add</button>
    </form>
    <ul id="event-list"></ul>
  </aside>
</main>
<script src="script.js"></script>
</body>
</html>
