<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Calendar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bf0'/%3E%3Crect x='7' y='9' width='18' height='16' rx='3' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M7 14h18M12 6v5M20 6v5' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b5bf0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try {
    const t = JSON.parse(localStorage.getItem('pc.v2') || '{}').settings?.theme;
    document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch { /* ignore */ }
</script>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo"></span><span>Calendar</span></div>
    <nav class="nav">
      <button class="nav-btn" data-tab="calendar" data-icon="calendar"><span>Calendar</span></button>
      <button class="nav-btn" data-tab="subjects" data-icon="tag"><span>Subjects</span></button>
      <button class="nav-btn" data-tab="integrations" data-icon="plug"><span>Integrations</span></button>
    </nav>
    <div id="side-extra" class="side-extra"></div>
    <div class="side-foot">
      <div id="sync-status" class="sync-status"></div>
      <button id="theme-btn" class="icon-btn" aria-label="Toggle theme"></button>
    </div>
  </aside>
  <main class="main">
    <section id="tab-calendar" class="tab"></section>
    <section id="tab-subjects" class="tab"></section>
    <section id="tab-integrations" class="tab"></section>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast-wrap"></div>
<script src="integrations.js"></script>
<script src="script.js"></script>
</body>
</html>
